[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "permit2/=lib/permit2/",
    "forge-std/=lib/forge-std/src/",
]

fs_permissions = [{ access = "read-write", path = "./vectors" }, { access = "read", path = "./deployments" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[fuzz]
runs = 512

[invariant]
runs = 200
depth = 120

[lint]
exclude_lints = ["unsafe-typecast", "block-timestamp", "reentrancy-events", "reentrancy-no-eth", "unsafe-oz-erc721-mint"]
